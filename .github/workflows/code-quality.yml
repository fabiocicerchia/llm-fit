name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2
        with:
          # The action is pinned but the tool it downloads was not: it
          # resolved `latest`, and editorconfig-checker v4.0.0 renamed its
          # release assets from ec-* to editorconfig-checker-*. The action
          # looks for `ec-linux-amd64*`, so every run started failing with
          # "The binary 'ec-linux-amd64*' not found". v4 is a deliberate
          # bump, not something a release should make for us.
          version: v3.11.3

      # The action above only downloads the binary and adds it to PATH;
      # without this step nothing is ever checked.
      - name: editorconfig
        run: editorconfig-checker

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b  # branch master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # go-version-file reads both the `go` and `toolchain` lines in go.mod, so
      # the patched toolchain pinned there is the one CI builds with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # No `make lint` here: the contract points that verb at the whole
      # pre-commit gate, which the quality job above already runs — and this
      # job installs Go only, so it has no pre-commit to run it with.
      - run: make test
      - run: make build
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Without this the action resolves whatever golangci-lint is
          # latest, so the same commit lints differently on different
          # days (FC-GEN-059).
          version: v2.13.2
