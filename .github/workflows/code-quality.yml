name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@v2

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@v3.0.1

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # go-version-file reads both the `go` and `toolchain` lines in go.mod, so
      # the patched toolchain pinned there is the one CI builds with.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint # go vet + gofmt check
      - run: make test
      - run: make build
      - uses: golangci/golangci-lint-action@v9
