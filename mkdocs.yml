site_name: llm-fit
site_description: >-
  Which LLMs this machine can run, and how fast — memory and bandwidth
  arithmetic across llama.cpp, Ollama, vLLM, SGLang, ExLlamaV2, MLX and
  TensorRT-LLM.
repo_url: https://github.com/fabiocicerchia/llm-fit
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
